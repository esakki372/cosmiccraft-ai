<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Comic Preview - ComicCraft AI</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .panel { border-bottom: 2px solid #eee; padding: 20px 0; margin-bottom: 20px; }
        .panel img { max-width: 100%; border-radius: 8px; display: block; margin: 15px auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .download-btn { display: block; width: 220px; margin: 30px auto; background: #28a745; color: white; text-align: center; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: bold; }
        .download-btn:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Your AI Generated Comic</h1>
        {% for panel in layout %}
        <div class="panel">
            <h3>Panel {{ panel.panel_number }}: {{ panel.title }}</h3>
            {% if panel.image_path %}
                <img src="/{{ panel.image_path }}" alt="Panel Illustration">
            {% endif %}
            <p><strong>Scene Description:</strong> {{ panel.scene_description }}</p>
            <p><strong>Script & Narration:</strong> {{ panel.narration }}</p>
        </div>
        {% endfor %}
        <a href="/{{ pdf_path }}" class="download-btn" download onclick="setTimeout(function(){window.location.href='/export-success';}, 1000);">Download PDF Comic</a>
    </div>
</body>
</html>
